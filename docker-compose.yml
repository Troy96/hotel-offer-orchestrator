version: "3.9"

services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - temporal
      - redis
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - REDIS_HOST=redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - temporal
      - redis
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - REDIS_HOST=redis